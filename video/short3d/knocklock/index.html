<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secret knock lock - 3D Short</title>
<link rel="stylesheet" href="../../engine/stage.css">
<link rel="stylesheet" href="../../engine3d/kit.css">
<style>
  html, body, #stage { width: 1080px; height: 1920px; }
  #c3d { width: 1080px; height: 1920px; }
  .vig { background: radial-gradient(900px 1300px at 50% 45%, transparent 55%, rgba(5,9,18,.55) 100%); }
  .shade { position: absolute; left: 0; right: 0; height: 520px; pointer-events: none; }
  .shade.top { top: 0; background: linear-gradient(rgba(6,10,20,.78), rgba(6,10,20,0)); }
  .shade.bot { bottom: 0; background: linear-gradient(rgba(6,10,20,0), rgba(6,10,20,.82)); }
  .chip { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); padding: 12px 30px; border-radius: 999px;
    background: var(--amber); color: #1a1206; font: 900 44px var(--ui); letter-spacing: .06em; white-space: nowrap; }
  .hook { position: absolute; left: 60px; right: 60px; top: 230px; text-align: center; font: 900 92px/1.05 var(--display);
    color: #fff; text-shadow: 0 8px 40px rgba(0,0,0,.7); }
  .hook b { color: var(--amber); }
  .meter { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); display: flex; align-items: center; gap: 26px;
    padding: 20px 34px; border-radius: 30px; background: rgba(11,18,32,.88); border: 3px solid #2b3a5c; }
  .meter .lk { font-size: 64px; line-height: 1; width: 74px; text-align: center; }
  .meter .slot { width: 64px; height: 64px; border-radius: 50%; border: 6px solid #3a4a6c; }
  .meter .slot.long { width: 150px; border-radius: 34px; }
  .meter .slot.on { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 30px rgba(255,181,71,.7); }
  .meter .slot.ok { background: #3dff6a; border-color: #3dff6a; box-shadow: 0 0 30px rgba(60,255,110,.7); }
  .meter .slot.bad { background: #ff4a4a; border-color: #ff4a4a; box-shadow: 0 0 30px rgba(255,70,70,.7); }
  .meter .lab { font: 900 40px var(--ui); color: #c9d4e8; min-width: 210px; text-align: center; letter-spacing: .04em; }
  .cap { position: absolute; left: 60px; right: 60px; top: 1390px; text-align: center; font: 900 76px/1.12 var(--display);
    color: #fff; text-shadow: 0 6px 28px rgba(0,0,0,.85), 0 0 4px rgba(0,0,0,.9); -webkit-text-stroke: 2px rgba(0,0,0,.35); }
  .cap .w { opacity: .55; } .cap .w.now { opacity: 1; color: var(--amber); } .cap .w.done { opacity: 1; }
  .code { position: absolute; left: 70px; right: 70px; top: 420px; padding: 26px 34px; border-radius: 26px;
    background: rgba(14,21,38,.94); border: 3px solid #2b3a5c; font: 700 46px/1.5 var(--mono); color: #e6ebf3; white-space: pre; }
  .code .k { font: 800 26px var(--ui); color: var(--teal); letter-spacing: .12em; display: block; margin-bottom: 6px; }
  .code .n { color: var(--amber); } .code .f { color: #f39c4a; } .code .big { font-size: 64px; color: var(--amber); }
  .count { position: absolute; left: 50%; top: 760px; transform: translateX(-50%); font: 900 220px var(--display); color: #fff;
    text-shadow: 0 10px 50px rgba(0,0,0,.8); }
  .mont { position: absolute; left: 60px; right: 60px; top: 220px; text-align: center; font: 900 80px/1.08 var(--display); color: #fff;
    text-shadow: 0 8px 40px rgba(0,0,0,.8); }
  .mont small { display: inline-block; margin-top: 22px; padding: 10px 26px; border-radius: 999px; background: rgba(11,18,32,.9); font: 800 44px var(--ui); color: var(--teal); text-shadow: none; }
  .cta { position: absolute; left: 70px; right: 70px; top: 230px; padding: 34px; border-radius: 30px; text-align: center;
    background: rgba(11,18,32,.92); border: 4px solid var(--amber); }
  .cta .a { font: 900 74px/1.1 var(--display); color: #fff; } .cta .a b { color: var(--amber); }
  .cta .s { margin-top: 18px; font: 800 44px var(--ui); color: var(--teal); }
  .big3d { font-size: 48px !important; }
  .big3d .c { font-size: 40px !important; }
</style>
<script type="importmap">
{ "imports": { "three": "../../node_modules/three/build/three.module.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c3d" width="1080" height="1920"></canvas>
  <div class="vig"></div>
  <div class="shade top"></div><div class="shade bot"></div>
  <div id="ui" class="layer"></div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../engine/lib.js"></script>
<script type="module" src="scene.js"></script>
</body>
</html>
