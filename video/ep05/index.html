<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ESP32 From Zero - Episode 5</title>
<link rel="stylesheet" href="../engine/stage.css">
<style>
  /* pin chart tags */
  .ptag { position: absolute; border-radius: 8px; border: 2px solid; display: flex; align-items: center; justify-content: space-between;
    gap: 6px; padding: 0 9px; font: 700 15px var(--ui); white-space: nowrap; }
  .ptag .x { font-size: 13px; }
  .c-neutral { background: #16203a; border-color: #2c3b5e; color: #9fb0cf; }
  .c-power { background: rgba(255,93,108,.18); border-color: #ff5d6c; color: #ffc2c8; }
  .c-gnd { background: #222c40; border-color: #8a9ab8; color: #e3e9f5; }
  .c-gpio { background: rgba(25,195,180,.16); border-color: #19c3b4; color: #b9f3ec; }
  .c-flash { background: #ff5d6c; border-color: #ff5d6c; color: #2a0006; }
  .c-in { background: rgba(180,140,255,.2); border-color: #b48cff; color: #e2d5ff; }
  .c-strap { background: rgba(255,181,71,.2); border-color: #ffb547; color: #ffe3b8; }
  .c-serial { background: rgba(110,168,255,.18); border-color: #6ea8ff; color: #d3e4ff; }
  .c-ok { background: rgba(74,222,128,.2); border-color: #4ade80; color: #d6ffe4; }
  .c-en { background: #1d2333; border-color: #3a4560; color: #8090ad; }
  .info { position: absolute; text-align: center; }
  .info .big { font: 700 46px var(--display); line-height: 1.05; }
  .info .sub { font: 500 21px var(--ui); color: var(--muted); margin-top: 10px; line-height: 1.3; }
  .badge { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 12px;
    font: 700 22px var(--ui); white-space: nowrap; }
  .partcard { text-align: center; }
  .partcard .art { height: 250px; display: flex; align-items: center; justify-content: center; }
  .partcard .nm { font: 700 28px var(--display); }
  .partcard .ds { font: 500 20px var(--ui); color: var(--muted); margin-top: 6px; }
</style>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../engine/lib.js"></script>
<script src="../engine/board.js"></script>
<script src="../engine/components.js"></script>
<script src="../engine/breadboard.js"></script>
</head>
<body>
<div id="stage"></div>
<script src="ep05.js"></script>
</body>
</html>
