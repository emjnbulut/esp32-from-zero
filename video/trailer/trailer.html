<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ESP32 From Zero - channel trailer overlay</title>
<style>
  :root { --teal: #19c3b4; --amber: #ffb547; --bg: #0b1220; --panel: #121b2e; --line: #22304d; --muted: #8fa1c0;
    --ui: "Segoe UI Variable Text", "Segoe UI", sans-serif; --display: "Segoe UI Variable Display", "Segoe UI", sans-serif; --mono: "Cascadia Mono", Consolas, monospace; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: var(--ui); color: #fff; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  #shade { left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(0deg, rgba(5,9,18,.85) 0%, rgba(5,9,18,0) 34%); }
  #lt { left: 90px; bottom: 90px; }
  #lt .k { font: 800 26px var(--ui); letter-spacing: 5px; text-transform: uppercase; color: var(--teal); }
  #lt .h { font: 800 76px/1.05 var(--display); letter-spacing: -1.5px; margin-top: 8px; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  #bar { left: 90px; bottom: 70px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--teal), var(--amber)); }
  #logo { right: 60px; top: 50px; display: flex; align-items: center; gap: 14px; font: 800 22px var(--ui); letter-spacing: 3px; color: #fff; text-transform: uppercase; opacity: .9; }
  .card { position: absolute; inset: 0; background:
      radial-gradient(1200px 700px at 75% 20%, rgba(25,195,180,.14), transparent 60%),
      radial-gradient(900px 600px at 10% 90%, rgba(255,181,71,.09), transparent 60%), var(--bg); opacity: 0; }
  .card .grid { position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 85%); }
  .topic { position: absolute; width: 380px; height: 200px; background: var(--panel); border: 2px solid var(--line); border-radius: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .topic .i { font-size: 64px; line-height: 1; }
  .topic .n { font: 700 34px var(--display); }
  .sub { display: inline-flex; align-items: center; gap: 18px; padding: 22px 46px; border-radius: 999px; background: #ff3b3b; font: 800 46px var(--ui); }
  .ep1 { font: 600 36px var(--display); color: var(--muted); }
</style>
<script src="../../brand/logos.js"></script>
</head>
<body>
<div id="topics" class="card"><div class="grid"></div></div>
<div id="end" class="card"><div class="grid"></div></div>
<div id="shade" class="abs"></div>
<div id="lt" class="abs"><div class="k"></div><div class="h"></div></div>
<div id="bar" class="abs"></div>
<div id="logo" class="abs"></div>
<script src="trailer.js"></script>
</body>
</html>
