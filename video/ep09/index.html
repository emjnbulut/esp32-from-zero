<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ESP32 From Zero - Episode 9: Mini Project 1, a Smart Pedestrian Crossing</title>
<link rel="stylesheet" href="../engine/stage.css">
<style>
  .excard2 { position: absolute; z-index: 80; display: flex; align-items: center; gap: 44px; padding: 40px 56px; border-radius: 26px;
    background: #131c31; border: 3px solid var(--teal); box-shadow: 0 30px 80px rgba(0,0,0,.55); box-sizing: border-box; }
  .excard2 .em { font-size: 150px; line-height: 1; flex: none; }
  .excard2 .hd { font: 800 56px var(--display); color: var(--text); }
  .excard2 .ln { margin-top: 14px; font: 600 34px/1.35 var(--ui); color: #b9f3ec; }
  .excard2 .lim { margin-top: 22px; padding-top: 18px; border-top: 2px solid rgba(255,181,71,.35); font: 600 32px/1.35 var(--ui); color: #ffe3b8; }
  .excard2 .lim b { color: var(--amber); }
  .banner { position: absolute; display: flex; align-items: center; gap: 18px; padding: 12px 30px; border-radius: 14px;
    background: rgba(255,93,108,.16); border: 2px solid var(--red); color: #ffc2c8; font: 800 30px var(--ui); letter-spacing: .06em; white-space: nowrap; }
  .live { position: absolute; border-radius: 18px; background: #0f1830; border: 2px solid #2c3b5e; padding: 18px 28px; box-sizing: border-box; }
  .live .k { font: 800 22px var(--ui); letter-spacing: .14em; color: var(--muted); }
  .live .v { font: 800 76px var(--mono); color: var(--amber); margin-top: 6px; white-space: nowrap; }
  .arg { padding: 0 6px; border-radius: 8px; }
  .lvl { position: absolute; display: flex; align-items: center; gap: 18px; padding: 0 26px; border-radius: 16px; background: #121b2e; border: 2px solid #22304d;
    font: 800 36px var(--ui); white-space: nowrap; box-sizing: border-box; }
  .lvl .d { width: 46px; height: 46px; border-radius: 50%; background: #2a3550; }
  .stepbox { position: absolute; border-radius: 22px; background: #121b2e; border: 3px solid #22304d; padding: 20px 28px; box-sizing: border-box; opacity: .55; transition: none; }
  .stepbox .n { font: 800 64px/1 var(--mono); }
  .stepbox .l { font: 700 32px var(--ui); margin-top: 14px; white-space: nowrap; }
  .stepbox.on { opacity: 1; border-color: var(--c); box-shadow: 0 0 34px color-mix(in srgb, var(--c) 45%, transparent); }
  .pins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 60px; margin-top: 36px; font: 600 38px/1.6 var(--mono); }
</style>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../engine/lib.js"></script>
<script src="../engine/breadboard.js"></script>
</head>
<body>
<div id="stage"></div>
<script src="sketches.js"></script>
<script src="ep09.js"></script>
</body>
</html>
